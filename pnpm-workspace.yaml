# 官方 decky CLI 在 musl 容器里构建前端,让 pnpm 一并拉 rollup 的 musl 原生二进制
# (否则容器内报 Cannot find module @rollup/rollup-linux-x64-musl)。
packages:
  - "."
supportedArchitectures:
  os:
    - current
  cpu:
    - current
  libc:
    - glibc
    - musl

# minimatch / glob(及其 brace-expansion)的 DoS 系列 GHSA 都只经 @decky/rollup 进构建工具链、不进 dist/。
# @decky/rollup 1.0.2 把这两个插件锁在旧大版本,这里抬到不再依赖 glob / minimatch 的版本,
# 根除旧传递依赖,免得真漏洞被告警噪音淹掉。升级后须确认 pnpm build 的 dist/ 与升级前一致。
# 注意:package.json 里的 pnpm.overrides 必须与此处保持同一份值。本地 pnpm 11 只读这里
# (会警告 package.json 的 pnpm 字段被忽略),而官方构建容器是 pnpm 9.15.9,只读 package.json ——
# 少写任何一边,该 pnpm 算出的 overrides 与锁文件不符,frozen install 直接拒绝(v1.0.0-beta.12 CI 事故)。
overrides:
  "@rollup/plugin-commonjs": ^29.0.3
  rollup-plugin-delete: ^3.0.2
