# 官方 decky CLI 在 musl 容器里构建前端,让 pnpm 一并拉 rollup 的 musl 原生二进制
# (否则容器内报 Cannot find module @rollup/rollup-linux-x64-musl)。
packages:
  - "."
supportedArchitectures:
  os:
    - current
  cpu:
    - current
  libc:
    - glibc
    - musl

# brace-expansion 的 ReDoS(1.x / 2.x 各一条 GHSA)。两条都只经 @decky/rollup 进构建
# 工具链、不进 dist/,钉住是为了让告警面板归零,免得真漏洞被噪音淹掉。
# 注意:package.json 里的 pnpm.overrides 必须与此处保持同一份值。本地 pnpm 11 只读这里
# (会警告 package.json 的 pnpm 字段被忽略),而官方构建容器是 pnpm 9.15.9,只读 package.json ——
# 少写任何一边,该 pnpm 算出的 overrides 与锁文件不符,frozen install 直接拒绝(v1.0.0-beta.12 CI 事故)。
overrides:
  brace-expansion@1: ^1.1.16
  brace-expansion@2: ^2.1.2
