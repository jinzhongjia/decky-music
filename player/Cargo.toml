[package]
name = "player"
version = "1.0.8"
edition = "2021"

[[bin]]
name = "player"
path = "src/main.rs"

[dependencies]
# 拉流:纯 Rust TLS;异步 HTTP producer 向有界缓冲供数,供 rodio 同步 Read/Seek。
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots"] }
# 解码 + 输出:内置 symphonia 解码 + cpal 输出;动态链 libasound
rodio = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
wire = { path = "../wire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
mpris-server = { version = "0.10.0", features = ["tokio"] }
