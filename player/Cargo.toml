[package]
name = "player"
version = "1.1.3"
edition = "2021"

[[bin]]
name = "player"
path = "src/main.rs"

[dependencies]
# 拉流:纯 Rust TLS;异步 HTTP producer 向有界缓冲供数,供 rodio 同步 Read/Seek。
# TLS 用 ring(与 provider 同一套,不带 aws-lc 的大块代码与静态表),启动时在 main 里装为默认 provider。
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# 解码 + 输出:内置 symphonia 解码 + cpal 输出;动态链 libasound
# 只开播放与实际会收到的格式(QQ:FLAC/MP3/OGG;网易云:MP3/FLAC,个别 M4A);不要录音、WAV、抖动噪声。
rodio = { version = "0.22", default-features = false, features = ["playback", "flac", "mp3", "mp4", "vorbis"] }
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "sync", "time"] }
wire = { path = "../wire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
mpris-server = { version = "0.10.0", features = ["tokio"] }
# 体积:symphonia 用 lazy_static 声明 FFT 旋转因子等大表(最大一张 256KB)。std 实现的 Once 初始态非零,
# 整张尚未计算的表会以全零字节写进 .data(约 590KB);spin 实现初始态全零,落进不占文件的 .bss。
# 表照旧在首次使用时计算,之后的访问同样只是一次原子读。
lazy_static = { version = "1.5", features = ["spin_no_std"] }
# 体积:idna 不带 Unicode 后端(省约 120KB ICU 数据),只接受 ASCII 域名。拉流 URL 都是音源 CDN 的
# ASCII 域名;路径 / 查询里的中文走百分号编码,不经过 IDNA。
idna_adapter = "=1.0.0"

[dev-dependencies]
# 测试用 WAV 构造流;dev 依赖的特性不会进 release 构建(resolver 2)
rodio = { version = "0.22", default-features = false, features = ["wav"] }
