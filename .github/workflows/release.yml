name: Release Assets

on:
  release:
    types: [published]

permissions:
  contents: write

# Do not interrupt a release after some assets have already been uploaded.
concurrency:
  group: release-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up release runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.21.0"
          package-manager-cache: false

      - name: Set up release Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.16"

      - name: Install packaging system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends binutils curl git jq rsync unzip

      - name: Build plugin
        run: bash scripts/decky-build.sh

      - name: Get plugin info
        id: plugin_info
        run: |
          PLUGIN_NAME=$(jq -r '.name' plugin.json)
          echo "name=$PLUGIN_NAME" >> $GITHUB_OUTPUT
      # Must run before the CN step: release-cn.sh rebuilds out/, so read the pristine normal zip here.
      - name: Build full (self-contained) zip
        run: bash scripts/full-package.sh

      - name: Upload artifact to release
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: out/${{ steps.plugin_info.outputs.name }}.zip
          asset_name: ${{ steps.plugin_info.outputs.name }}.zip
          asset_content_type: application/zip

      - name: Upload full zip to release
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: Decky.Music.full.zip
          asset_name: Decky.Music.full.zip
          asset_content_type: application/zip

      - name: Mirror binaries + build & upload CN zip to R2
        env:
          TAG: ${{ github.event.release.tag_name }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/release-cn.sh

      - name: Upload CN zip to release
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: Decky.Music.cn.zip
          asset_name: Decky.Music.cn.zip
          asset_content_type: application/zip
