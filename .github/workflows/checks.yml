name: Checks

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  bridge:
    name: Bridge (Python 3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.16"
      # Deliberately no pip/uv install: Decky's bridge must remain stdlib-only.
      - name: Run complete bridge suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  qq:
    name: QQ (locked Python 3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: qq-provider
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.16"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.13"
          checksum: "745765a3b6e360ad76743599ae5c42e9278c7edf8bbff9fc76d05bf2623a04dd"
          enable-cache: false
      - name: Install actual provider and lint dependencies
        run: uv sync --locked --python 3.11.16 --group dev
      - name: Require actual upstream packages
        run: uv run --locked --no-sync python -c 'import qqmusic_api, curl_cffi'
      - name: Run complete QQ suite
        run: uv run --locked --no-sync python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Lint QQ
        run: uv run --locked --no-sync ruff check .

  ui:
    name: UI (pnpm ${{ matrix.pnpm }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pnpm: ["9.15.9", "11.3.0"]
    env:
      # Exercise both managers rather than automatically switching to packageManager.
      # Keep package.json AND pnpm-workspace.yaml overrides for the Decky pnpm 9 builder.
      npm_config_manage_package_manager_versions: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Install exact package manager
        env:
          PNPM_VERSION: ${{ matrix.pnpm }}
        run: |
          npm install --global --ignore-scripts "pnpm@$PNPM_VERSION"
          test "$(pnpm --version)" = "$PNPM_VERSION"
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Run complete UI suite
        run: pnpm test:ui
      - name: Typecheck and formatting
        run: pnpm lint
      - name: Build frontend
        run: pnpm build

  rust:
    name: Rust (1.98.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential pkg-config libasound2-dev
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy --no-self-update
      - name: Check Rust formatting
        run: cargo +1.98.0 fmt --all -- --check
      - name: Run complete Rust suite
        run: cargo +1.98.0 test --workspace --locked
      - name: Lint all Rust targets
        run: cargo +1.98.0 clippy --workspace --all-targets --locked -- -D warnings
